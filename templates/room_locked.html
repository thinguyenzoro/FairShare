<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<meta property="og:image" content="{{ url_for('static', filename='preview_1200x630.jpg') }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ url_for('static', filename='preview_1200x630.jpg') }}">
<meta name="robots" content="noindex, nofollow">
<title>{{ room_slug }} - Splitbill</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
</head>
<body data-room="{{ room_slug }}">
<div class="theme-toggle-row">
  <div style="flex: 1; display: flex; align-items: center;">
    <a href="/" title="Trang chủ" style="display: flex; align-items: center; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Splitbill Logo" style="width: 36px; height: 36px; object-fit: contain; border-radius: 8px;">
    </a>
  </div>
  <a href="/" style="text-decoration:none; background: var(--primary); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;" data-i18n="createGroupBtn">+ Tạo nhóm mới</a>
  <button id="langToggle" type="button" class="lang-toggle">VI</button>
  <label class="theme-switch">
    <input type="checkbox" id="themeToggle">
    <span class="slider"></span>
  </label>
</div>
<div class="landing">
  <h1 data-i18n="lockedTitle">This room is locked</h1>
  <p class="subtitle" data-i18n="lockedSubtitle">Enter the PIN to view this room</p>
  <form id="pinForm" class="landing-form">
    <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus data-i18n-placeholder="pinPlaceholder" placeholder="PIN">
    <button type="submit" data-i18n="unlockBtn">Unlock</button>
  </form>
  <p id="pinError" class="error"></p>
</div>
<script>
  const roomSlug = {{ room_slug | tojson }};
  const form = document.getElementById('pinForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = document.getElementById('pinInput').value.trim();
    const errorEl = document.getElementById('pinError');
    errorEl.textContent = '';

    const res = await fetch(`/${roomSlug}/api/unlock`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = t(data.error) || t('GENERIC_ERROR');
      return;
    }
    window.location.reload();
  });
</script>

<button id="feedbackBtn" type="button" class="feedback-fab" data-i18n="feedbackBtn">Feedback</button>
<script src="{{ url_for('static', filename='feedback.js') }}"></script>
</body>
</html>
